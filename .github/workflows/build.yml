name: Build & Release SmartLamp Studio

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App & Library
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build and Pack TuyaNet.Native Class Library
        run: |
          dotnet pack libs/TuyaNet.Native/TuyaNet.Native.csproj -c Release -o releases

      - name: Compile Lightweight WPF Application (.NET 9 win-x64)
        run: |
          dotnet publish src/SmartLampApp.csproj -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist

      - name: Create Windows Release Packages
        shell: powershell
        run: |
          $versionFile = "src/AppVersion.cs"
          $appVersion = "3.1.0"
          if (Test-Path $versionFile) {
              $content = Get-Content $versionFile -Raw
              if ($content -match 'Version = "([^"]+)"') {
                  $appVersion = $matches[1]
              }
          }
          New-Item -ItemType Directory -Path releases -Force

          # Package Windows WPF Application
          $winZipPath = "releases/SmartLampStudio_v${appVersion}_win-x64.zip"
          Compress-Archive -Path "dist/SmartLampApp.exe", "README.md", "LICENSE" -DestinationPath $winZipPath -Force
          Copy-Item -Path "dist/SmartLampApp.exe" -Destination "releases/SmartLampApp_v${appVersion}.exe" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: releases/*

  build-linux:
    name: Build Linux Multi-OS Packages (deb, pacman, tar.gz for x64 & arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd dpkg binutils

      - name: Build All Linux Packages (.deb, .pkg.tar.zst, .tar.gz for x64 and arm64)
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: releases/*

  release:
    name: Publish Multi-OS GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Application Version
        id: get_version
        run: |
          VERSION="3.1.0"
          if [ -f "src/AppVersion.cs" ]; then
            VERSION=$(grep 'public const string Version' src/AppVersion.cs | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download Windows Packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: releases

      - name: Download Linux Packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: releases

      - name: List Release Packages
        run: |
          ls -lh releases/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          files: |
            releases/*.deb
            releases/*.pkg.tar.zst
            releases/*.tar.gz
            releases/*.zip
            releases/*.exe
            releases/*.nupkg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
