name: Build & Release SmartLamp Studio

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows App & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build and Pack TuyaNet.Native Class Library
        run: |
          dotnet pack libs/TuyaNet.Native/TuyaNet.Native.csproj -c Release -o releases

      - name: Compile Lightweight WPF Application (.NET 9 win-x64)
        run: |
          dotnet publish src/SmartLampApp.csproj -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist

      - name: Compile Cross-Platform Linux Native CLI (.NET 9 linux-x64)
        run: |
          dotnet publish src/SmartLamp.Cli/SmartLamp.Cli.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=true -o dist/cli-linux-x64

      - name: Compile Cross-Platform Avalonia Desktop App (.NET 9 linux-x64)
        run: |
          dotnet publish src/SmartLamp.Desktop/SmartLamp.Desktop.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o dist/desktop-linux-x64

      - name: Create Release Package (Zip, Tar & Standalone Executables)
        shell: powershell
        run: |
          $versionFile = "src/AppVersion.cs"
          $appVersion = "3.0"
          if (Test-Path $versionFile) {
              $content = Get-Content $versionFile -Raw
              if ($content -match 'Version = "([^"]+)"') {
                  $appVersion = $matches[1]
              }
          }
          New-Item -ItemType Directory -Path releases -Force

          # Package Windows WPF Application
          $winZipPath = "releases/SmartLampStudio_v${appVersion}_win-x64.zip"
          Compress-Archive -Path "dist/SmartLampApp.exe", "README.md", "LICENSE" -DestinationPath $winZipPath -Force
          Copy-Item -Path "dist/SmartLampApp.exe" -Destination "releases/SmartLampApp_v${appVersion}.exe" -Force

          # Package Linux CLI
          tar -czvf "releases/SmartLamp_CLI_v${appVersion}_linux-x64.tar.gz" -C dist/cli-linux-x64 smartlamp

          # Package Linux Desktop Application
          tar -czvf "releases/SmartLampStudio_v${appVersion}_linux-x64.tar.gz" -C dist/desktop-linux-x64 SmartLampDesktop

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: SmartLampStudio-Packages
          path: |
            releases/*

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/*.zip
            releases/*.tar.gz
            releases/*.exe
            releases/*.nupkg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
