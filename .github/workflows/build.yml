name: Build & Release SmartLamp Studio

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App & Library
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Inno Setup Compiler
        shell: powershell
        run: |
          choco install innosetup --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and Package Windows App, Library & Installer
        shell: powershell
        run: |
          .\scripts\build.ps1 -Target Windows -Pack

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: releases/*

  build-linux:
    name: Build Linux Multi-OS Packages (deb, pacman, tar.gz for x64 & arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd dpkg binutils

      - name: Build All Linux Packages (.deb, .pkg.tar.zst, .tar.gz for x64 and arm64)
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: releases/*

  release:
    name: Publish Multi-OS GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Application Version
        id: get_version
        run: |
          VERSION="3.2.0"
          if [ -f "VERSION" ]; then
            VERSION=$(cat VERSION | tr -d '\r\n')
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download Windows Packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: releases

      - name: Download Linux Packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: releases

      - name: List Release Packages
        run: |
          ls -lh releases/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          body_path: RELEASE_NOTES.md
          files: |
            releases/*.deb
            releases/*.pkg.tar.zst
            releases/*.tar.gz
            releases/*.zip
            releases/*.exe
            releases/*.nupkg
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
